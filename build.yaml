name: 'Myriad Local Intros'
guid: '5d9f187d-c598-478d-8dc3-0223f3c39938'
version: 2
targetAbi: '10.11.0.0'
framework: 'net9.0'
owner: 'MyriadRising'
overview: 'Display flashy intros before movies and other videos'
description: >
  Select a flashy pre-roll from local storage to run before any video content. The video details are loaded from disk after a video is played from the library from the beginning of the video. A random video is selected, and all videos in the local directory are enabled by default. Specific videos can be enabled or disabled as necessary. After videos are loaded for the first time, additional videos found in the directory are not enabled by default.

category: 'MoviesAndShows'
artifacts:
  - 'Jellyfin.Plugin.LocalIntros.dll'
changelog: |-
  - UI: collapsible per-video rule cards showing name, Play-For status, and Freq when collapsed
  - UI: card color-coded by Play For state (blue=Movies, purple=Shows, green=Both, red=None)
  - UI: one-click Enable/Disable button per video (toggles None/Both)
  - UI: Tags/Ratings/Users are now collapsed checkbox-dropdowns instead of scrollable multi-selects, laid out horizontally
  - Removed unused "Clean Intros" legacy-migration button
